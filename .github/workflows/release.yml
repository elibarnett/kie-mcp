name: Release

# Push a version tag to cut a release:
#   git tag v4.4.1 && git push origin v4.4.1
# This verifies the tag matches every in-repo version string, publishes to npm
# (with provenance), and creates the GitHub Release using the matching
# CHANGELOG section as the notes. workflow_dispatch is an emergency manual path
# that publishes the current package.json version without the tag checks.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Verify tag matches all version strings
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          SRV=$(node -p "require('./server.json').version")
          PKGROOT=$(node -p "require('./server.json').packages[0].version")
          MJS=$(grep -oE "version: '[0-9]+\.[0-9]+\.[0-9]+' }" server.mjs | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)
          echo "tag=$TAG  package.json=$PKG  server.json=$SRV  server.json/packages=$PKGROOT  server.mjs=$MJS"
          fail=0
          for pair in "package.json:$PKG" "server.json:$SRV" "server.json/packages:$PKGROOT" "server.mjs:$MJS"; do
            name="${pair%%:*}"; val="${pair#*:}"
            if [ "$val" != "$TAG" ]; then echo "::error::version mismatch — tag is v$TAG but $name is $val"; fail=1; fi
          done
          [ "$fail" -eq 0 ] || exit 1

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: |
          node --check server.mjs
          npm pack --dry-run

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '
            $0 ~ ("^## \\[" ver "\\]") { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md | sed '/./,$!d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md for details." > release-notes.md
            echo "::warning::no CHANGELOG section found for $VER — using placeholder notes"
          fi
          echo "----- release notes -----"; cat release-notes.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
